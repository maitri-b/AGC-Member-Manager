<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Sarabun', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 12px;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      background: white;
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      max-width: 500px;
      width: 100%;
      overflow: hidden;
    }
    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 20px 16px;
      text-align: center;
    }
    .header h1 {
      font-size: 20px;
      margin-bottom: 6px;
      line-height: 1.3;
    }
    .header p {
      opacity: 0.9;
      font-size: 13px;
    }
    .content {
      padding: 20px 16px;
    }
    /* Mobile responsive */
    @media (max-width: 640px) {
      body {
        padding: 8px;
        align-items: flex-start;
        padding-top: 20px;
      }
      .container {
        border-radius: 12px;
      }
      .header h1 {
        font-size: 18px;
      }
      .header p {
        font-size: 12px;
      }
      .content {
        padding: 16px 12px;
      }
    }
    .info-box {
      background: #f7fafc;
      border-left: 4px solid #667eea;
      padding: 16px;
      margin-bottom: 20px;
      border-radius: 4px;
    }
    .info-box p {
      margin: 4px 0;
      color: #2d3748;
      font-size: 14px;
    }
    .info-box strong {
      color: #1a202c;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      color: #2d3748;
      font-weight: 600;
      font-size: 14px;
    }
    select, input[type="number"] {
      width: 100%;
      padding: 12px;
      border: 2px solid #cbd5e0;
      border-radius: 8px;
      font-size: 14px;
      transition: all 0.3s;
    }
    select:focus, input[type="number"]:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }
    .file-input-wrapper {
      position: relative;
      display: inline-block;
      width: 100%;
    }
    input[type="file"] {
      width: 100%;
      padding: 12px;
      border: 2px dashed #cbd5e0;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s;
    }
    input[type="file"]:hover {
      border-color: #667eea;
      background: #f7fafc;
    }
    .preview {
      margin-top: 12px;
      display: none;
    }
    .preview img {
      max-width: 100%;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    button:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .message {
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 16px;
      display: none;
    }
    .message.success {
      background: #c6f6d5;
      color: #22543d;
      border: 1px solid #9ae6b4;
    }
    .message.error {
      background: #fed7d7;
      color: #742a2a;
      border: 1px solid #fc8181;
    }
    .loading {
      text-align: center;
      padding: 20px;
      display: none;
    }
    .spinner {
      border: 3px solid #f3f3f3;
      border-top: 3px solid #667eea;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 12px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🧾 อัพโหลดสลิปการชำระเงิน</h1>
      <p>Agents Club - Event Registration</p>
    </div>

    <div class="content">
      <div class="info-box">
        <p><strong>รหัสลงทะเบียน:</strong> <?= registrationId ?></p>
        <p><strong>บริษัท:</strong> <?= registration.companyName ?></p>
        <p><strong>ยอดรวมทั้งหมด:</strong> <?= totalAmount.toLocaleString() ?> บาท</p>
        <? if (hasDepositMode) { ?>
          <p><strong>มัดจำ:</strong> <?= depositAmount.toLocaleString() ?> บาท</p>
          <p><strong>ยอดคงเหลือ:</strong> <?= remainingAmount.toLocaleString() ?> บาท</p>
        <? } ?>
      </div>

      <div id="messageBox" class="message"></div>

      <form id="uploadForm" onsubmit="return false;">
        <div class="form-group">
          <label for="paymentType">🏷️ ประเภทการชำระ</label>
          <select id="paymentType" name="paymentType" required onchange="handlePaymentTypeChange()">
            <option value="">-- เลือกประเภท --</option>
            <? if (hasDepositMode) { ?>
              <option value="deposit">งวดที่ 1: ชำระมัดจำ (<?= depositAmount.toLocaleString() ?> บาท)</option>
              <option value="remaining">งวดที่ 2: ชำระยอดคงเหลือ (<?= remainingAmount.toLocaleString() ?> บาท)</option>
            <? } else { ?>
              <option value="full">ชำระเต็มจำนวน (<?= totalAmount.toLocaleString() ?> บาท)</option>
            <? } ?>
            <option value="additional">ชำระเพิ่มเติม (ระบุจำนวนเงิน)</option>
          </select>
        </div>

        <div class="form-group" id="amountGroup" style="display: none;">
          <label for="amount">💰 จำนวนเงิน (บาท)</label>
          <input
            type="number"
            id="amount"
            name="amount"
            min="1"
            step="0.01"
            placeholder="กรอกจำนวนเงิน"
          >
          <p style="font-size: 12px; color: #718096; margin-top: 4px;">
            สำหรับการชำระเพิ่มเติม เช่น ค่าใช้จ่ายเสริม หรือการเปลี่ยนแปลงจำนวนผู้เข้าร่วม
          </p>
        </div>
        <div class="form-group">
          <label for="slipFile">📎 เลือกไฟล์สลิป (JPG, PNG, PDF)</label>
          <input
            type="file"
            id="slipFile"
            name="slipFile"
            accept="image/*,application/pdf"
            required
            onchange="previewFile()"
          >
          <div id="preview" class="preview"></div>
        </div>

        <button type="button" id="submitBtn" onclick="handleSubmit()">
          📤 อัพโหลดสลิป
        </button>
      </form>

      <div id="loading" class="loading">
        <div class="spinner"></div>
        <p>กำลังอัพโหลด...</p>
      </div>
    </div>
  </div>

  <script>
    const PAYMENT_AMOUNTS = {
      deposit: <?= depositAmount ?>,
      remaining: <?= remainingAmount ?>,
      full: <?= totalAmount ?>
    };

    function handlePaymentTypeChange() {
      const paymentType = document.getElementById('paymentType').value;
      const amountGroup = document.getElementById('amountGroup');
      const amountInput = document.getElementById('amount');

      if (paymentType === 'additional') {
        amountGroup.style.display = 'block';
        amountInput.required = true;
        amountInput.value = '';
      } else {
        amountGroup.style.display = 'none';
        amountInput.required = false;
        // Auto-fill amount based on payment type
        if (PAYMENT_AMOUNTS[paymentType]) {
          amountInput.value = PAYMENT_AMOUNTS[paymentType];
        }
      }
    }

    function previewFile() {
      const file = document.getElementById('slipFile').files[0];
      const preview = document.getElementById('preview');

      if (file && file.type.startsWith('image/')) {
        const reader = new FileReader();
        reader.onload = function(e) {
          preview.innerHTML = '<img src="' + e.target.result + '" alt="Preview">';
          preview.style.display = 'block';
        };
        reader.readAsDataURL(file);
      } else {
        preview.innerHTML = '';
        preview.style.display = 'none';
      }
    }

    function handleSubmit() {
      const paymentType = document.getElementById('paymentType').value;
      const fileInput = document.getElementById('slipFile');
      const file = fileInput.files[0];
      const amountInput = document.getElementById('amount');

      if (!paymentType) {
        showMessage('error', 'กรุณาเลือกประเภทการชำระ');
        return;
      }

      if (!file) {
        showMessage('error', 'กรุณาเลือกไฟล์');
        return;
      }

      // Validate amount for additional payment type
      if (paymentType === 'additional') {
        const amount = parseFloat(amountInput.value);
        if (!amount || amount <= 0) {
          showMessage('error', 'กรุณากรอกจำนวนเงินที่ถูกต้อง');
          return;
        }
      }

      // Validate file size (max 5MB)
      if (file.size > 5 * 1024 * 1024) {
        showMessage('error', 'ไฟล์มีขนาดใหญ่เกินไป (สูงสุด 5MB)');
        return;
      }

      // Show loading
      document.getElementById('uploadForm').style.display = 'none';
      document.getElementById('loading').style.display = 'block';
      document.getElementById('messageBox').style.display = 'none';

      // Read file as base64
      const reader = new FileReader();
      reader.onload = function(e) {
        const base64Data = e.target.result.split(',')[1]; // Remove data:image/...;base64, prefix

        // Get amount based on payment type
        let amount = null;
        if (paymentType === 'additional') {
          amount = parseFloat(amountInput.value);
        } else if (PAYMENT_AMOUNTS[paymentType]) {
          amount = PAYMENT_AMOUNTS[paymentType];
        }

        const formData = {
          registrationId: '<?= registrationId ?>',
          eventId: '<?= eventId ?>',
          paymentType: paymentType,
          amount: amount,
          fileData: base64Data,
          fileName: file.name,
          mimeType: file.type
        };

        // Submit via google.script.run
        google.script.run
          .withSuccessHandler(onSuccess)
          .withFailureHandler(onFailure)
          .processForm(formData);
      };

      reader.onerror = function() {
        showMessage('error', 'ไม่สามารถอ่านไฟล์ได้');
        document.getElementById('uploadForm').style.display = 'block';
        document.getElementById('loading').style.display = 'none';
      };

      reader.readAsDataURL(file);
    }

    function onSuccess(response) {
      document.getElementById('loading').style.display = 'none';

      if (response.success) {
        // Show success message with instruction
        const messageBox = document.getElementById('messageBox');
        messageBox.className = 'message success';
        messageBox.innerHTML = `
          <div style="text-align: center;">
            <div style="font-size: 48px; margin-bottom: 12px;">✅</div>
            <div style="font-size: 16px; font-weight: 600; margin-bottom: 8px;">
              อัพโหลดสลิปสำเร็จ!
            </div>
            <div style="font-size: 14px; color: #2d5016; line-height: 1.6;">
              ${response.message}
            </div>
            <div style="margin-top: 16px; padding-top: 16px; border-top: 1px solid #9ae6b4; font-size: 13px; color: #22543d;">
              <strong>คุณสามารถปิดหน้าต่างนี้แล้ว</strong><br>
              กลับไปที่หน้าลงทะเบียนเพื่อดูสถานะการชำระเงิน
            </div>
          </div>
        `;
        messageBox.style.display = 'block';
      } else {
        showMessage('error', '❌ ' + response.error);
        document.getElementById('uploadForm').style.display = 'block';
      }
    }

    function onFailure(error) {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('uploadForm').style.display = 'block';
      showMessage('error', '❌ เกิดข้อผิดพลาด: ' + error.message);
    }

    function showMessage(type, message) {
      const messageBox = document.getElementById('messageBox');
      messageBox.className = 'message ' + type;
      messageBox.textContent = message;
      messageBox.style.display = 'block';
    }
  </script>
</body>
</html>
