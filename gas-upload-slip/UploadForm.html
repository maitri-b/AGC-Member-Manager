<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Sarabun', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 20px;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      background: white;
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      max-width: 500px;
      width: 100%;
      overflow: hidden;
    }
    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 24px;
      text-align: center;
    }
    .header h1 {
      font-size: 24px;
      margin-bottom: 8px;
    }
    .header p {
      opacity: 0.9;
      font-size: 14px;
    }
    .content {
      padding: 24px;
    }
    .info-box {
      background: #f7fafc;
      border-left: 4px solid #667eea;
      padding: 16px;
      margin-bottom: 20px;
      border-radius: 4px;
    }
    .info-box p {
      margin: 4px 0;
      color: #2d3748;
      font-size: 14px;
    }
    .info-box strong {
      color: #1a202c;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      color: #2d3748;
      font-weight: 600;
      font-size: 14px;
    }
    .file-input-wrapper {
      position: relative;
      display: inline-block;
      width: 100%;
    }
    input[type="file"] {
      width: 100%;
      padding: 12px;
      border: 2px dashed #cbd5e0;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s;
    }
    input[type="file"]:hover {
      border-color: #667eea;
      background: #f7fafc;
    }
    .preview {
      margin-top: 12px;
      display: none;
    }
    .preview img {
      max-width: 100%;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    button:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .message {
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 16px;
      display: none;
    }
    .message.success {
      background: #c6f6d5;
      color: #22543d;
      border: 1px solid #9ae6b4;
    }
    .message.error {
      background: #fed7d7;
      color: #742a2a;
      border: 1px solid #fc8181;
    }
    .loading {
      text-align: center;
      padding: 20px;
      display: none;
    }
    .spinner {
      border: 3px solid #f3f3f3;
      border-top: 3px solid #667eea;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 12px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🧾 อัพโหลดสลิปการชำระเงิน</h1>
      <p>Agents Club - Event Registration</p>
    </div>

    <div class="content">
      <div class="info-box">
        <p><strong>รหัสลงทะเบียน:</strong> <?= registrationId ?></p>
        <p><strong>บริษัท:</strong> <?= registration.companyName ?></p>
        <p><strong>ยอดที่ต้องชำระ:</strong> <?= amount.toLocaleString() ?> บาท</p>
        <p><strong>ประเภท:</strong>
          <?= paymentType === 'deposit' ? 'ชำระมัดจำ' : 'ชำระยอดคงเหลือ' ?>
        </p>
      </div>

      <div id="messageBox" class="message"></div>

      <form id="uploadForm" onsubmit="return false;">
        <div class="form-group">
          <label for="slipFile">📎 เลือกไฟล์สลิป (JPG, PNG, PDF)</label>
          <input
            type="file"
            id="slipFile"
            name="slipFile"
            accept="image/*,application/pdf"
            required
            onchange="previewFile()"
          >
          <div id="preview" class="preview"></div>
        </div>

        <button type="button" id="submitBtn" onclick="handleSubmit()">
          📤 อัพโหลดสลิป
        </button>
      </form>

      <div id="loading" class="loading">
        <div class="spinner"></div>
        <p>กำลังอัพโหลด...</p>
      </div>
    </div>
  </div>

  <script>
    function previewFile() {
      const file = document.getElementById('slipFile').files[0];
      const preview = document.getElementById('preview');

      if (file && file.type.startsWith('image/')) {
        const reader = new FileReader();
        reader.onload = function(e) {
          preview.innerHTML = '<img src="' + e.target.result + '" alt="Preview">';
          preview.style.display = 'block';
        };
        reader.readAsDataURL(file);
      } else {
        preview.innerHTML = '';
        preview.style.display = 'none';
      }
    }

    function handleSubmit() {
      const fileInput = document.getElementById('slipFile');
      const file = fileInput.files[0];

      if (!file) {
        showMessage('error', 'กรุณาเลือกไฟล์');
        return;
      }

      // Validate file size (max 5MB)
      if (file.size > 5 * 1024 * 1024) {
        showMessage('error', 'ไฟล์มีขนาดใหญ่เกินไป (สูงสุด 5MB)');
        return;
      }

      // Show loading
      document.getElementById('uploadForm').style.display = 'none';
      document.getElementById('loading').style.display = 'block';
      document.getElementById('messageBox').style.display = 'none';

      // Read file as base64
      const reader = new FileReader();
      reader.onload = function(e) {
        const base64Data = e.target.result.split(',')[1]; // Remove data:image/...;base64, prefix

        const formData = {
          registrationId: '<?= registrationId ?>',
          eventId: '<?= eventId ?>',
          paymentType: '<?= paymentType ?>',
          fileData: base64Data,
          fileName: file.name,
          mimeType: file.type
        };

        // Submit via google.script.run
        google.script.run
          .withSuccessHandler(onSuccess)
          .withFailureHandler(onFailure)
          .processForm(formData);
      };

      reader.onerror = function() {
        showMessage('error', 'ไม่สามารถอ่านไฟล์ได้');
        document.getElementById('uploadForm').style.display = 'block';
        document.getElementById('loading').style.display = 'none';
      };

      reader.readAsDataURL(file);
    }

    function onSuccess(response) {
      document.getElementById('loading').style.display = 'none';

      if (response.success) {
        showMessage('success', '✅ ' + response.message);

        // Auto close after 3 seconds
        setTimeout(function() {
          google.script.host.close();
        }, 3000);
      } else {
        showMessage('error', '❌ ' + response.error);
        document.getElementById('uploadForm').style.display = 'block';
      }
    }

    function onFailure(error) {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('uploadForm').style.display = 'block';
      showMessage('error', '❌ เกิดข้อผิดพลาด: ' + error.message);
    }

    function showMessage(type, message) {
      const messageBox = document.getElementById('messageBox');
      messageBox.className = 'message ' + type;
      messageBox.textContent = message;
      messageBox.style.display = 'block';
    }
  </script>
</body>
</html>
